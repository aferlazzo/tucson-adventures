<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123f57">
  <meta name="description" content="Interactive Tucson comedy: ordinary errands, local absurdity, and decisions that make everything worse.">
  <title>Tucson Adventures</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HXM5FKL3KQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-HXM5FKL3KQ');
  </script>
  <link rel="stylesheet" href="/styles.css?v=2">
  <link rel="stylesheet" href="/choice-colors.css?v=1">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <a class="brand" href="/" data-home>Tucson Adventures</a>
        <span class="tagline">You had one simple plan. Then Tucson happened.</span>
      </div>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="/about/" data-about>About</a>
      </nav>
    </div>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer>Made in Tucson—with sunshine, imagination, and deferred maintenance. <a href="/about/" data-about>About</a></footer>
  <script src="/more-adventures.js?v=15" defer></script>
  <script src="/jurisdiction-humor.js?v=1" defer></script>
  <script src="/name-reuse-bit.js?v=2" defer></script>
  <script src="/hawk-adventure.js?v=1" defer></script>
  <script src="/commute-adventure.js?v=1" defer></script>
  <script src="/app.js?v=17" defer></script>
  <script src="/hawk-router.js?v=1" defer></script>
  <script src="/commute-router.js?v=3" defer></script>
  <script src="/remove-unrequested-address.js?v=1" defer></script>
  <script src="/adventure-continuation-title.js?v=7" defer></script>
  <script src="/driving-direction-clarity.js?v=1" defer></script>
  <script src="/analytics.js" defer></script>
  <script>
    const improveFirstImpression = () => {
      document.querySelectorAll('.adventure-tile strong').forEach(label => {
        const cleaned = label.textContent.replace(/^Adventure\s+\d+:\s*/i, '');
        if (cleaned !== label.textContent) label.textContent = cleaned;
      });
      document.querySelectorAll('#app .eyebrow').forEach(label => {
        if (/^Adventure\s+\d+$/i.test(label.textContent.trim())) label.remove();
      });

      const homeHeading = document.querySelector('#app h1');
      const homeLede = document.querySelector('#app .lede');
      if (location.pathname === '/' && homeHeading && homeLede) {
        homeHeading.textContent = 'You had one simple plan. Then Tucson happened.';
        homeLede.textContent = 'Pick a familiar Tucson problem, make the decision, and see how much worse it can get. You do not need to know Tucson to recognize what happens next.';
      }
    };

    const correctMayorPronouns = () => {
      document.querySelectorAll('.consequence p').forEach(paragraph => {
        const oldText = 'He promises full transparency, then discovers every relevant file has been classified as routine utility work. Even he looks impressed.';
        const newText = 'She promises full transparency, then discovers every relevant file has been classified as routine utility work. Even she looks impressed.';
        if (paragraph.textContent.trim() === oldText) paragraph.textContent = newText;
      });
    };

    const refreshUiFixes = () => {
      improveFirstImpression();
      correctMayorPronouns();
    };
    new MutationObserver(refreshUiFixes).observe(document.getElementById('app'), {childList:true, subtree:true});
    document.addEventListener('DOMContentLoaded', refreshUiFixes);
  </script>
</body>
</html>
