<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123f57">
  <meta name="description" content="Interactive stories about the strange decisions Tucson makes for you.">
  <title>Tucson Adventures</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HXM5FKL3KQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-HXM5FKL3KQ');
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <a class="brand" href="/" data-home>Tucson Adventures</a>
        <span class="tagline">The strange decisions Tucson makes for you.</span>
      </div>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="/about/" data-about>About</a>
      </nav>
    </div>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer>Made in Tucson—with sunshine, imagination, and deferred maintenance. <a href="/about/" data-about>About</a></footer>
  <script src="/more-adventures.js?v=15" defer></script>
  <script src="/hawk-adventure.js?v=1" defer></script>
  <script src="/commute-adventure.js?v=1" defer></script>
  <script src="/app.js?v=16" defer></script>
  <script src="/hawk-router.js?v=1" defer></script>
  <script src="/commute-router.js?v=1" defer></script>
  <script src="/analytics.js" defer></script>
  <script>
    // Keep the interface lean without triggering a mutation loop.
    const simplifyAdventureLabels = () => {
      document.querySelectorAll('.adventure-tile strong').forEach(label => {
        const cleaned = label.textContent.replace(/^Adventure\s+\d+:\s*/i, '');
        if (cleaned !== label.textContent) label.textContent = cleaned;
      });
      document.querySelectorAll('.adventure-tile span').forEach(subtitle => subtitle.remove());
      document.querySelectorAll('#app .eyebrow').forEach(label => {
        if (/^Adventure\s+\d+$/i.test(label.textContent.trim())) label.remove();
      });
    };

    // Correct the mayor pronouns in the pothole adventure without replacing app.js.
    const correctMayorPronouns = () => {
      document.querySelectorAll('.consequence p').forEach(paragraph => {
        const oldText = 'He promises full transparency, then discovers every relevant file has been classified as routine utility work. Even he looks impressed.';
        const newText = 'She promises full transparency, then discovers every relevant file has been classified as routine utility work. Even she looks impressed.';
        if (paragraph.textContent.trim() === oldText) paragraph.textContent = newText;
      });
    };

    const refreshUiFixes = () => {
      simplifyAdventureLabels();
      correctMayorPronouns();
    };
    new MutationObserver(refreshUiFixes).observe(document.getElementById('app'), {childList:true, subtree:true});
    document.addEventListener('DOMContentLoaded', refreshUiFixes);
  </script>
</body>
</html>
