<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123f57">
  <meta name="description" content="Interactive stories about the strange decisions Tucson makes for you.">
  <title>Tucson Adventures</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HXM5FKL3KQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-HXM5FKL3KQ');
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <a class="brand" href="/" data-home>Tucson Adventures</a>
        <span class="tagline">The strange decisions Tucson makes for you.</span>
      </div>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="/about/" data-about>About</a>
      </nav>
    </div>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer>Made in Tucson—with sunshine, imagination, and deferred maintenance. <a href="/about/" data-about>About</a></footer>
  <script src="/more-adventures.js" defer></script>
  <script src="/app.js" defer></script>
  <script src="/analytics.js" defer></script>
  <script>
    // Keep the interface lean: story titles already identify each adventure.
    const removeAdventureNumberLabels = () => {
      document.querySelectorAll('.adventure-tile strong').forEach(label => {
        label.textContent = label.textContent.replace(/^Adventure\s+\d+:\s*/i, '');
      });
      document.querySelectorAll('#app .eyebrow').forEach(label => {
        if (/^Adventure\s+\d+$/i.test(label.textContent.trim())) label.remove();
      });
    };
    new MutationObserver(removeAdventureNumberLabels).observe(document.getElementById('app'), {childList:true, subtree:true});
    document.addEventListener('DOMContentLoaded', removeAdventureNumberLabels);
  </script>
</body>
</html>
